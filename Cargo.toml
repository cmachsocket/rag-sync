[package]
name = "rag-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
walkdir = "2"
serde-saphyr = "2"
serde = {version="1",features = ["derive"] }
sha2 = "0.11"
diesel = { version = "2", features = ["sqlite"] }
diesel-async = { version = "0.9", features = ["sqlite", "deadpool"] }
reqwest = { version = "0.13", features = ["json", "stream", "form","multipart", "query"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io","codec"] }
serde_json = "1"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["full", "test-util"] }
